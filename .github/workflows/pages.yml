name: Deploy static game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Collect ready-to-serve files
        run: |
          mkdir -p "$RUNNER_TEMP/geometry-glitch-pages"
          cp index.html .nojekyll "$RUNNER_TEMP/geometry-glitch-pages/"
          cp -R src vendor public "$RUNNER_TEMP/geometry-glitch-pages/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/geometry-glitch-pages
      - uses: actions/deploy-pages@v4
        id: deployment
